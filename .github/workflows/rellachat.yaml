name: rellachat

# Checks for the Rellachat voice service only (rellachat/). The upstream Pipecat workflows
# check the framework under src/, which this fork does not modify.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rellachat/**"
      - ".github/workflows/rellachat.yaml"
  pull_request:
    paths:
      - "rellachat/**"
      - ".github/workflows/rellachat.yaml"

concurrency:
  group: rellachat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: "Lint, format and tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the service
        run: |
          uv venv --python 3.12
          uv pip install -e ".[anthropic,cartesia,webrtc,runner,silero,rnnoise]" pytest ruff

      - name: Ruff formatter
        run: .venv/bin/ruff format --diff rellachat

      - name: Ruff linter
        run: .venv/bin/ruff check rellachat

      - name: Tests
        run: .venv/bin/python -m pytest rellachat/tests -q
